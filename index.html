<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
  <title>Battle Royale</title>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vg"></div>
  <div id="scope"><i class="h"></i><i class="v"></i></div>
  <div id="fb"></div>
  <div class="hud" id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
  <div class="hud" id="hm">✕</div>
  <div class="hud" id="kf"></div>
  <div class="hud" id="msg"></div>
  <div class="hud" id="prompt"></div>
  <div class="hud" id="reti"></div>
  <div class="hud pan" id="hp">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="#ff6a5a">
        <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" />
      </svg>
      <div class="bar"><i id="hpf"></i></div>
      <b id="hpn">100</b><span class="kit" id="mkn"></span></div>
    <div class="row">
      <svg viewBox="0 0 24 24" fill="#6fbfff">
        <path d="M12 2l9 3v7c0 5-4 9-9 10C7 21 3 17 3 12V5z" />
      </svg>
      <div class="bar ar"><i id="arf"></i></div>
      <b id="arn">0</b><span class="kit" id="vsn"></span></div>
  </div>
  <div class="hud pan" id="ammo">
    <div class="top"><span id="wname">USP</span>
      <svg viewBox="0 0 120 40">
        <path id="wicop" fill="currentColor" d="" />
      </svg>
    </div>
    <div id="amm"><b id="mag">12</b><span id="rsv">/ 36</span></div>
    <div id="rlt"></div>
    <div id="chips"></div>
  </div>
  <div class="hud" id="cmpw">
    <canvas id="cmp"></canvas>
  </div>
  <div class="hud" id="dd"></div>
  <div class="hud" id="snd"></div>
  <div class="hud" id="zw"><b id="ztv">00:00</b>
    <div id="ztrk">
      <div id="zsafe"></div>
      <div id="zrun">
        <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
          <circle cx="14.5" cy="4.5" r="2" fill="currentColor" stroke="none" />
          <path d="M12 9l-3 3 3 2.5-2 5.5M12 9l3.5 2.2 3-1M12 14.5l3 2 .5 4M9 12l-3 .5" />
        </svg>
      </div>
    </div>
    <b id="zdist">0m</b></div>
  <div class="hud" id="pcount"></div>
  <div class="hud" id="fps"></div>
  <div class="hud pan" id="inv"></div>
  <div class="hud" id="ivdrag"></div>
  <div class="hud" id="ivcur"></div>
  <div class="hud" id="bigmap">
    <canvas id="bmc"></canvas>
    <div id="bmt"></div>
  </div>
  <div class="hud" id="mm">
    <div id="mmh" style="display:none"></div>
    <canvas id="mmc"></canvas>
  </div>
  <div id="start">
    <div class="pause-box">
      <button class="mbtn primary" id="go">Resume</button>
      <button class="mbtn" id="pauseset">Settings</button>
      <button class="mbtn" id="tomenu">Main menu</button>
    </div>
  </div>
  <div id="menu">
    <svg class="mbg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#141a26" />
          <stop offset=".45" stop-color="#3a2a33" />
          <stop offset=".72" stop-color="#b8583a" />
          <stop offset=".82" stop-color="#f2a64a" />
        </linearGradient>
        <radialGradient id="sun" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff1c4" />
          <stop offset=".35" stop-color="#ffc45a" />
          <stop offset="1" stop-color="#ffc45a" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5a3a36" />
          <stop offset="1" stop-color="#0d1218" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#sky)" />
      <circle cx="1060" cy="600" r="260" fill="url(#sun)" />
      <path d="M0 610 L120 560 L230 585 L340 520 L430 548 L560 470 L650 515 L760 455 L880 530 L990 500 L1110 560 L1230 505 L1350 560 L1480 520 L1600 570 V900 H0 Z" fill="#4a2c30" opacity=".7" />
      <path d="M0 660 L160 600 L260 625 L420 545 L520 590 L640 560 L740 610 L860 575 L980 625 L1100 590 L1240 640 L1400 600 L1600 650 V900 H0 Z" fill="#2a1c22" />
      <rect y="660" width="1600" height="240" fill="url(#sea)" />
      <g stroke="#ffc45a" stroke-linecap="round" opacity=".45">
        <path d="M900 690 H1220" stroke-width="3" />
        <path d="M950 712 H1170" stroke-width="2" />
        <path d="M990 736 H1130" stroke-width="2" />
        <path d="M1030 760 H1090" stroke-width="1.5" />
      </g>
      <path d="M170 700 L300 640 L380 662 L470 612 L560 650 L640 638 L720 676 L800 700 Z" fill="#120d10" />
      <g fill="#120d10">
        <rect x="470" y="598" width="5" height="24" />
        <rect x="462" y="594" width="21" height="6" />
      </g>
      <g class="mbg-plane" fill="#0e0b0d">
        <path d="M0 0 L46 -3 L52 -10 L56 -10 L54 -2 L64 0 L54 2 L56 10 L52 10 L46 3 Z" />
      </g>
    </svg>
    <div class="mshade"></div>
    <button id="setbtn" class="iconbtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
      </svg>
    </button>
    <div class="mcenter">
      <h1>Battle Royale</h1>
      <p id="mt">One island. Last one alive wins.</p>
      <button class="mbtn primary big" id="play">Start</button>
      <div id="mdiff"><span>Bot difficulty</span></div>
    </div>
  </div>
  <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settitle">
    <div class="sbox">
      <div class="shead">
        <h2 id="settitle">Settings</h2>
        <button class="iconbtn" id="setclose" title="Close" aria-label="Close">✕</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab on" role="tab" data-tab="tcfg">Configuration</button>
        <button class="tab" role="tab" data-tab="tgfx">Graphics</button>
        <button class="tab" role="tab" data-tab="tctl">Controls</button>
      </div>
      <div class="tpane on" id="tcfg" role="tabpanel">
        <label class="srow"><span>Mouse sensitivity</span>
          <input id="sens" type="range" min="0.4" max="3" step="0.1" value="1"><output id="sensv">1.0</output></label>
        <label class="srow"><span>Footsteps volume</span>
          <input id="fvol" type="range" min="0" max="100" step="5" value="60"><output id="fvolv">60%</output></label>
        <div class="srow"><span>Sound direction marks</span><div class="seg" id="msnd"></div></div>
      </div>
      <div class="tpane" id="tgfx" role="tabpanel">
        <div class="srow stack"><span>Quality</span><div class="seg" id="gpreset"></div>
          <small class="shint" id="ghint"></small></div>
        <label class="srow"><span>Resolution</span>
          <input id="gres" type="range" min="50" max="100" step="5" value="100"><output id="gresv">100%</output></label>
        <div class="srow"><span>View distance</span><div class="seg" id="gview"></div></div>
        <div class="srow"><span>Shadows</span><div class="seg" id="gshadow"></div></div>
        <div class="srow"><span>Antialiasing</span><div class="seg" id="gaa"></div></div>
        <div class="srow"><span>Frame rate limit</span><div class="seg" id="gfpsmax"></div></div>
        <div class="srow"><span>Show FPS</span><div class="seg" id="gfps"></div></div>
        <div class="srow"><span>Graphics card</span><div class="sval"><b id="ggpu"></b><small class="shint" id="ggpunote"></small></div></div>
      </div>
      <div class="tpane" id="tctl" role="tabpanel">
        <table class="ctl">
          <thead><tr><th>Action</th><th>Key</th></tr></thead>
          <tbody id="ctlbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
